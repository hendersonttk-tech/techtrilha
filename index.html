<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechTrilha — Aprenda Tecnologia</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14182b;--mut:#5c637a;--bd:#e3e6f0;--ac:#4f46e5;--g1:#22c55e;--g2:#f59e0b;--g3:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b30;--tx:#eef0fb;--mut:#9aa3c2;--bd:#262b48;--ac:#818cf8}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b30;--tx:#eef0fb;--mut:#9aa3c2;--bd:#262b48;--ac:#818cf8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.brand{font-weight:800;font-size:18px;margin-bottom:8px}.brand span{color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--bd);background:transparent;color:var(--tx);padding:8px 14px;border-radius:999px;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(28px,7vw,44px);line-height:1.1;margin:0 0 12px}
.hero p{color:var(--mut);font-size:17px;max-width:600px}
.btn{display:inline-block;margin-top:8px;background:var(--ac);color:#fff;border:0;padding:12px 20px;border-radius:12px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.lvl{cursor:pointer;border-top:4px solid var(--c)}
.lvl h3{margin:0 0 6px}.lvl p{margin:0;color:var(--mut);font-size:14px}
.tag{font-size:12px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
h2{margin:6px 0 4px;font-size:26px}.sub{color:var(--mut);margin:0 0 14px}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;padding:0 14px}
summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--ac);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0 0 8px;color:var(--mut)}
details ul{margin:0 0 14px;padding-left:20px}details li{margin-bottom:4px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;color:var(--mut);font-size:14px}.stats b{display:block;font-size:24px;color:var(--tx)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
</style>
</head>
<body>
<header>
<div class="brand">Tech<span>Trilha</span> 🚀</div>
<nav id="nav"></nav>
</header>
<main id="app"></main>
<footer>TechTrilha · aprenda tecnologia no seu ritmo</footer>
<script>
const L={
ini:{n:"Iniciante",c:"var(--g1)",d:"Os primeiros passos: entenda como o mundo digital funciona.",items:[
["O que é um computador?","Hardware é a parte física; software são os programas que rodam nela.",["CPU: o 'cérebro' que executa instruções","Memória RAM: espaço de trabalho temporário","Armazenamento (SSD/HD): onde os arquivos ficam guardados","Placa-mãe: conecta todas as peças"]],
["Como a internet funciona","Uma rede global de computadores conectados que trocam informações.",["Seu dispositivo pede uma página a um servidor","O endereço (domínio) é traduzido em IP pelo DNS","O navegador recebe e mostra o conteúdo","Wi-Fi é só o jeito de chegar ao roteador, não a internet em si"]],
["Sistemas operacionais","O software que gerencia o aparelho e permite usar outros programas.",["Windows, macOS e Linux no computador","Android e iOS no celular","Ele controla arquivos, memória e dispositivos conectados"]],
["Segurança básica","Hábitos simples que evitam a maioria dos golpes.",["Use senhas longas e diferentes em cada site","Ative a verificação em duas etapas (2FA)","Desconfie de links e anexos inesperados (phishing)","Mantenha o sistema e os apps atualizados","Use um gerenciador de senhas"]],
["O que é a nuvem","Usar computadores de outra empresa pela internet em vez do seu.",["Google Drive, iCloud e OneDrive guardam arquivos online","Você acessa de qualquer aparelho","Vantagem: backup e compartilhamento fáceis"]],
["Inteligência artificial sem mistério","Programas que aprendem padrões a partir de muitos exemplos.",["Assistentes como o Claude geram texto e ajudam em tarefas","Recomendações de vídeo e música também usam IA","A IA pode errar: sempre confira informações importantes"]]]},
int:{n:"Intermediário",c:"var(--g2)",d:"Hora de colocar a mão na massa e entender como as coisas são construídas.",items:[
["Lógica de programação","A base de qualquer linguagem: pensar em passos claros.",["Variáveis guardam valores","Condicionais (if/else) tomam decisões","Laços (for/while) repetem tarefas","Funções reaproveitam código"]],
["HTML, CSS e JavaScript","O trio que constrói quase todo site.",["HTML: estrutura e conteúdo","CSS: aparência e layout","JavaScript: interatividade","Dica: crie uma página pessoal como primeiro projeto"]],
["Git e GitHub","Controle de versão: o histórico de tudo que você muda no código.",["git init, add, commit: salvar versões","branch: testar ideias sem quebrar o principal","GitHub: guarda o código online e facilita trabalho em equipe"]],
["Redes: IP, DNS e HTTP","Como os dispositivos se encontram e conversam.",["IPv4 e IPv6 identificam dispositivos","DNS traduz nomes em endereços","HTTP/HTTPS é o protocolo da web; o 'S' indica criptografia","Códigos comuns: 200 (ok), 404 (não encontrado), 500 (erro no servidor)"]],
["Bancos de dados e SQL","Onde os sistemas guardam informações de forma organizada.",["Tabelas com linhas e colunas","SELECT, INSERT, UPDATE e DELETE","Chave primária identifica cada registro","NoSQL (ex.: MongoDB) guarda documentos flexíveis"]],
["APIs","Contratos que permitem que programas conversem entre si.",["REST usa URLs e métodos GET, POST, PUT, DELETE","Os dados costumam vir em JSON","Chaves de API autenticam quem está pedindo","Exemplo: app de clima consultando um serviço de previsão"]]]},
ava:{n:"Avançado",c:"var(--g3)",d:"Conceitos de quem projeta sistemas robustos e escaláveis.",items:[
["Estruturas de dados e complexidade","Escolher a estrutura certa muda o desempenho radicalmente.",["Arrays, listas ligadas, pilhas, filas","Tabelas hash: busca média em O(1)","Árvores e grafos para hierarquias e redes","Notação Big-O mede como o custo cresce com a entrada"]],
["Arquitetura de sistemas","Como organizar software grande para evoluir sem dor.",["Monólito vs microsserviços","Filas de mensagens (Kafka, RabbitMQ) desacoplam serviços","Cache (Redis) reduz latência","Balanceadores de carga distribuem o tráfego"]],
["Containers e Kubernetes","Empacotar e orquestrar aplicações de forma previsível.",["Docker isola app e dependências em um container","Kubernetes gerencia muitos containers automaticamente","CI/CD automatiza testes e deploys","Infraestrutura como código (Terraform)"]],
["Machine learning e LLMs","Modelos que aprendem com dados e geram resultados.",["Treinamento ajusta milhões ou bilhões de parâmetros","Redes neurais e o mecanismo de atenção (transformers)","Embeddings representam significado como números","RAG une um modelo a uma base de conhecimento","Avaliar vieses e alucinações é essencial"]],
["Criptografia","A matemática por trás da privacidade na internet.",["Simétrica (AES): mesma chave para cifrar e decifrar","Assimétrica (RSA, curvas elípticas): par de chaves pública e privada","Hash (SHA-256) gera uma 'impressão digital' dos dados","Certificados TLS garantem que o site é quem diz ser"]],
["Sistemas distribuídos","Muitos computadores trabalhando como um só, e falhando às vezes.",["Teorema CAP: consistência, disponibilidade e tolerância a partições","Replicação e sharding escalam bancos de dados","Consenso (Raft, Paxos) mantém nós de acordo","Projete sempre pensando que tudo pode falhar"]]]}
};
const nav=document.getElementById("nav"),app=document.getElementById("app");
const tabs=[["home","Início"],["ini","Iniciante"],["int","Intermediário"],["ava","Avançado"]];
function go(k){
 history.replaceState(null,"","#"+k);
 [...nav.children].forEach((b,i)=>b.classList.toggle("on",tabs[i][0]===k));
 if(k==="home"){
  app.innerHTML=`<section class="hero"><h1>Aprenda tecnologia do zero ao avançado.</h1><p>Três trilhas com conteúdos práticos e diretos: comece pelo básico, evolua para o intermediário e mergulhe em temas avançados.</p><button class="btn" onclick="go('ini')">Começar pelo iniciante →</button></section>
  <div class="grid">${["ini","int","ava"].map(x=>`<div class="card lvl" style="--c:${L[x].c}" onclick="go('${x}')"><div class="tag">Pasta</div><h3>${L[x].n}</h3><p>${L[x].d}</p></div>`).join("")}</div>
  <div class="stats"><div><b>3</b>trilhas</div><div><b>18</b>conteúdos</div><div><b>100%</b>gratuito</div></div>`;
 } else {
  const l=L[k];
  app.innerHTML=`<div class="tag" style="--c:${l.c}">Trilha</div><h2>${l.n}</h2><p class="sub">${l.d}</p>`+l.items.map(i=>`<details><summary>${i[0]}</summary><p>${i[1]}</p><ul>${i[2].map(t=>`<li>${t}</li>`).join("")}</ul></details>`).join("");
 }
 scrollTo(0,0);
}
tabs.forEach(t=>{const b=document.createElement("button");b.textContent=t[1];b.onclick=()=>go(t[0]);nav.appendChild(b)});
const h=location.hash.slice(1);go(tabs.some(t=>t[0]===h)?h:"home");
</script>
</body>
</html>
